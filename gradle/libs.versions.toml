[versions]
junit = "4.13.2"

# --- Build tooling -----------------------------------------------------
# AGP / Gradle come from this project's own wrapper (AGP 9.4.1, Gradle 9.8).
# AGP 9 has built-in Kotlin, so there is NO org.jetbrains.kotlin.android plugin.
agp = "9.4.1"
# Kotlin is pinned to 2.3.21 on purpose: KSP (needed by Room and Hilt) has no
# official Kotlin 2.4 line yet. KSP is no longer tied to the Kotlin version
# (2.3.x works with Kotlin 2.2 and newer); AGP 9 needs KSP >= 2.3.6.
# When KSP announces Kotlin 2.4 support, raise `kotlin` to 2.4.20 and re-sync.
kotlin = "2.3.21"
ksp = "2.3.12"

# --- AndroidX / Compose --------------------------------------------------
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
dataStore = "1.2.1"

# --- Database / DI -------------------------------------------------------
room = "2.8.5"
# Hilt 2.59+ is required for AGP 9; 2.59.2 fixed the first AGP 9 bugs.
hilt = "2.60.1"
# Kept at 1.2.0 because it still exposes androidx.hilt.navigation.compose.hiltViewModel
# (newer releases moved hiltViewModel to a new artifact/package).
hiltNavigationCompose = "1.2.0"

# --- Media -----------------------------------------------------------------
media3 = "1.11.1"
documentfile = "1.1.0"
work = "2.12.0"
mediaRouter = "1.8.1"
# Audio tag writing (Edit File). Published on JitPack, not Maven Central. LGPL-licensed.
jaudiotagger = "2.3.15"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose artifacts take their version from the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediaRouter" }
jaudiotagger = { group = "com.github.adonai", name = "jaudiotagger-android", version.ref = "jaudiotagger" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
